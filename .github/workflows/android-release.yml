name: Android APK Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: İstizan çevrimdışı APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Node.js hazırla
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java hazırla
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK hazırla
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Gradle önbelleğini hazırla
        uses: gradle/actions/setup-gradle@v4

      - name: Bağımlılıkları kur
        shell: bash
        run: |
          set -euo pipefail
          npm install --include=dev --legacy-peer-deps

      - name: Expo Android projesini oluştur
        run: npx expo prebuild --platform android --clean --no-install

      - name: Debug APK derle
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            2>&1 | tee ../android-build.log

      - name: APK hazırla
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/istizan-offline.apk
          test -s dist/istizan-offline.apk
          cd dist
          sha256sum istizan-offline.apk > istizan-offline.apk.sha256
          printf '%s\n' \
            'İstizan — çevrimdışı Android APK' \
            'istizan-offline.apk dosyasını telefona kurun.' \
            'İnternet ve Expo Go gerekmez; JavaScript paketi APK içine gömülüdür.' \
            'Google Play yayını için özel imzalama anahtarı gerekir.' > KURULUM.txt

      - name: APK indirme dosyasını yükle
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: istizan-offline-apk
          path: |
            dist/istizan-offline.apk
            dist/istizan-offline.apk.sha256
            dist/KURULUM.txt
          if-no-files-found: error
          retention-days: 90

      - name: Etiketli sürüme APK ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: İstizan ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/istizan-offline.apk
            dist/istizan-offline.apk.sha256

      - name: Derleme hata kaydını yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-error-${{ github.run_number }}
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 14
